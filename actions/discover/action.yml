# discover — legge product.yaml (radice) e i component.yaml (una cartella per componente), verifica le
# convenzioni di docs/ci.md (chiavi, kind, file obbligatori, arc presente in <PROD>-ARC-001.md, nomi
# unici e minuscoli) e restituisce la matrix dei componenti. Un manifest non valido fa fallire la CI.
name: discover
description: Legge e verifica product.yaml e i component.yaml, restituisce prodotto e componenti in JSON
outputs:
  product:
    description: product.yaml in JSON
    value: ${{ steps.discover.outputs.product }}
  components:
    description: componenti in JSON (lista di name, path, kind, arc)
    value: ${{ steps.discover.outputs.components }}
runs:
  using: composite
  steps:
    - id: discover
      shell: bash
      run: python3 -I "${{ github.action_path }}/main.py"
