# test-evidence — fonde i JUnit del run ci (test-<comp>, e2e) in test-report.csv (allegato 1 di
# HE-TPL-006) ed estrae la copertura per componente in coverage.csv. Fallisce se manca un JUnit
# atteso: una prova mancante non è una prova (ADR 0006, HE-SOP-005 par. 3.3).
name: test-evidence
description: Rapporto dei test e copertura dagli artifact del run ci del commit taggato
inputs:
  components:
    description: componenti in JSON (output `components` di discover)
    required: true
  product:
    description: product.yaml in JSON (output `product` di discover)
    required: true
  evidence:
    description: cartella con gli artifact scaricati (test-<comp>/, e2e/)
    required: true
  out:
    description: cartella di uscita
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        PRODUCT: ${{ inputs.product }}
        EVIDENCE: ${{ inputs.evidence }}
        OUT: ${{ inputs.out }}
      run: python3 -I "${{ github.action_path }}/main.py"
