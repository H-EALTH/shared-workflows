# qms-records: registrazioni della versione da allegare a HE-TPL-006 par. 12, con i controlli che si
# possono fare solo al tag. Il candidate.yml del prodotto lo chiama dopo promote. Le prove non si
# rifanno: JUnit, copertura, report Trivy e SBOM sono quelli del run ci del commit (input `ci-run-id`).
# Tre job in parallelo, ognuno con i suoi permessi e il suo artifact evidence-*, che publish allega:
#   test-report   test-report.csv, coverage.csv (allegato 1); fallisce se manca una prova o il run ci
#                 contiene test non superati
#   soup          scan-report.csv, <PROD>-REC-001_Lista-SOUP.csv, soup-diff.csv (allegato 5, CHK-021)
#   traceability  <PROD>-REC-002_Matrice-tracciabilita.csv, export User Need e Requisiti (allegato 2,
#                 CHK-001...006)
# Il chiamante concede contents: read, actions: read, pull-requests: read.
name: qms-records
on:
  workflow_call:
    inputs:
      components:
        description: componenti in JSON (output `components` di discover)
        required: true
        type: string
      product:
        description: product.yaml in JSON (output `product` di discover)
        required: true
        type: string
      ci-run-id:
        description: id del run ci del commit (output `ci-run-id` di promote)
        required: true
        type: string
    secrets:
      LINEAR_API_KEY:
        description: lettura dei documenti User Need e Requisiti e delle issue del progetto Linear
        required: true

jobs:
  test-report:
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with:
          pattern: test-*
          path: ${{ runner.temp }}/evidence
          run-id: ${{ inputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: verify
          path: ${{ runner.temp }}/evidence/verify
          run-id: ${{ inputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: H-EALTH/shared-workflows/actions/collect-test-evidence@v0.0.1
        with:
          components: ${{ inputs.components }}
          product: ${{ inputs.product }}
          evidence: ${{ runner.temp }}/evidence
          out: ${{ runner.temp }}/out
      - uses: actions/upload-artifact@v7
        with:
          name: evidence-test-report
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  soup:
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/download-artifact@v8
        with:
          pattern: scan-*
          path: ${{ runner.temp }}/evidence
          run-id: ${{ inputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          merge-multiple: true
          path: ${{ runner.temp }}/sbom
          run-id: ${{ inputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: H-EALTH/shared-workflows/actions/build-soup-list@v0.0.1
        with:
          components: ${{ inputs.components }}
          product: ${{ inputs.product }}
          evidence: ${{ runner.temp }}/evidence
          sbom: ${{ runner.temp }}/sbom
          tag: ${{ github.ref_name }}
          out: ${{ runner.temp }}/out
      - uses: actions/upload-artifact@v7
        with:
          name: evidence-soup
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  traceability:
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with:
          pattern: test-*
          path: ${{ runner.temp }}/evidence
          run-id: ${{ inputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: verify
          path: ${{ runner.temp }}/evidence/verify
          run-id: ${{ inputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: H-EALTH/shared-workflows/actions/build-traceability-matrix@v0.0.1
        with:
          components: ${{ inputs.components }}
          product: ${{ inputs.product }}
          evidence: ${{ runner.temp }}/evidence
          tag: ${{ github.ref_name }}
          out: ${{ runner.temp }}/out
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: evidence-traceability
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
