# publish: ultimo job di release.yml del prodotto, dopo qms-records. Produce
# pull-requests.csv (allegato 3) e la Release «candidate <tag>», prerelease, con tutti gli allegati di
# HE-TPL-006 par. 12, singoli e in bundle-<tag>.zip:
#   - gli artifact evidence-* di questo run (allegati 1, 2, 5);
#   - artifacts.txt e SBOM (allegato 4) del run ci del commit.
name: publish
on:
  workflow_call:
    inputs:
      product:
        description: product.yaml in JSON (output `product` di discover)
        required: true
        type: string
      ci-run-id:
        description: id del run ci del commit (output `ci-run-id` di promote)
        required: true
        type: string

env:
  TAG: ${{ github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/download-artifact@v8
        with:
          pattern: evidence-*
          merge-multiple: true
          path: ${{ runner.temp }}/out
      - uses: actions/download-artifact@v8
        with:
          name: artifacts
          path: ${{ runner.temp }}/out
          run-id: ${{ inputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          merge-multiple: true
          path: ${{ runner.temp }}/out
          run-id: ${{ inputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: H-EALTH/shared-workflows/actions/collect-release-notes@v0.0.4
        with:
          product: ${{ inputs.product }}
          tag: ${{ github.ref_name }}
          artifacts: ${{ runner.temp }}/out/artifacts.txt
          out: ${{ runner.temp }}/out
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release «candidate»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          mv "$OUT/notes.md" "$RUNNER_TEMP/notes.md"
          (cd "$OUT" && zip -q -r "$RUNNER_TEMP/bundle-$TAG.zip" . -x '.*')
          mv "$RUNNER_TEMP/bundle-$TAG.zip" "$OUT/"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
              --title "candidate $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          if ! gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$OUT"/*; then
            echo "::error::allegati non caricati (Release immutabile?): una Release senza prove non è valida, ricrearla"
            exit 1
          fi
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease \
            --title "candidate $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "### publish $TAG"
            echo
            for f in "$OUT"/*; do echo "- \`$(basename "$f")\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
