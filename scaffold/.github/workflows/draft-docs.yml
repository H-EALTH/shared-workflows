# draft-docs: workflow separato, dopo la Release. Mai bloccante, mai asset della Release.
# Parte quando il workflow `release` si conclude con successo (workflow_run), oppure a mano con il tag
# (workflow_dispatch) per ripetere. Non usa `release: published`: la Release la crea `release` con il
# GITHUB_TOKEN, e gli eventi generati dal GITHUB_TOKEN non avviano altri workflow.
# Produce l'artifact draft-docs-<tag> con le bozze di HE-TPL-006 e HE-TPL-024 e, quando servono, le
# proposte per <PROD>-DTE-001 e <PROD>-IFU-001. Secret: ANTHROPIC_API_KEY.
name: draft-docs
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: tag della Release, es. so-ulss2-v1.2.0
        required: true
        type: string

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions: { contents: read }
    uses: H-EALTH/shared-workflows/.github/workflows/discover.yml@v0.5.0

  draft-docs:
    needs: discover
    permissions: { contents: read }
    uses: H-EALTH/shared-workflows/.github/workflows/draft-docs.yml@v0.5.0
    with:
      product: ${{ needs.discover.outputs.product }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
