# Dependabot aggiorna il tag di shared-workflows (github-actions), le immagini base pinnate al digest
# (docker, ADR 0005) e le dipendenze pip e npm di ogni cartella sotto app/ (ADR 0003, H-102).
# Ogni PR di Dependabot passa da pr-checks come le altre: chi la fonde compila la sezione
# «Aggiornamento di dipendenza» del modello e la collega alla issue Modifica (HE-SOP-004 par. 3.2).
# Dependabot non legge i component.yaml: un componente fuori da app/ va aggiunto a mano.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/app/**"]
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directories: ["/app/**"]
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directories: ["/app/**"]
    schedule: { interval: weekly }
